apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.agesignals'
version = '1.0.0'

android {
  namespace "expo.modules.agesignals"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google Play Age Signals API (beta): https://developer.android.com/google/play/age-signals
  implementation "com.google.android.play:age-signals:0.0.6"
}
